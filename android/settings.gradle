// Requires environment variable MAPBOX_DOWNLOADS_TOKEN for CI/EAS builds
pluginManagement {
  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

  repositories {
    def nodeModulesDir = new File(rootDir, "../node_modules")
    def localExpoMavenRepos = [] as List<File>
    if (nodeModulesDir.exists()) {
      nodeModulesDir.eachDirRecurse { dir ->
        if (dir.name == "local-maven-repo") {
          localExpoMavenRepos << dir
        }
      }
      localExpoMavenRepos = localExpoMavenRepos.sort { a, b -> a.absolutePath <=> b.absolutePath }
    }

    localExpoMavenRepos.each { repoDir ->
      maven { url = uri(repoDir.absolutePath) }
    }

    google()
    mavenCentral()
    maven { url "https://repo.expo.dev/maven" }
    maven { url "https://www.jitpack.io" }

    // Mapbox Maven (authenticated): ONLY Mapbox artifacts
    exclusiveContent {
      forRepository {
        maven {
          url "https://api.mapbox.com/downloads/v2/releases/maven"
          authentication { basic(org.gradle.authentication.http.BasicAuthentication) }
          credentials {
            username = "mapbox"
            password = System.getenv("MAPBOX_DOWNLOADS_TOKEN") ?: providers.gradleProperty("MAPBOX_DOWNLOADS_TOKEN").orNull
          }
        }
      }
      filter {
        includeGroupByRegex("com\\.mapbox(\\..*)?")
      }
    }
  }
}


extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'Drivest'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
