<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
    
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="coloredBlur"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- White background -->
  <rect width="180" height="180" fill="white"/>
  
  <!-- Shield with gradient -->
  <g filter="url(#shadow)">
    <!-- Main shield shape -->
    <path d="M 90 20 L 130 45 L 130 100 Q 130 135 90 155 Q 50 135 50 100 L 50 45 Z" 
          fill="url(#shieldGradient)" stroke="url(#goldGradient)" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Gold metallic trim (inner highlight) -->
    <path d="M 92 28 L 122 48 L 122 100 Q 122 130 90 148 Q 58 130 58 100 L 58 48 Z" 
          fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-opacity="0.6" stroke-linejoin="round"/>
  </g>
  
  <!-- Green checkmark circle background -->
  <circle cx="90" cy="85" r="35" fill="#10b981" opacity="0.95" filter="url(#shadow)"/>
  
  <!-- Gold accent ring around checkmark -->
  <circle cx="90" cy="85" r="35" fill="none" stroke="url(#goldGradient)" stroke-width="2"/>
  
  <!-- Green checkmark -->
  <g transform="translate(90, 85)">
    <path d="M -12 0 L -3 10 L 15 -8" 
          fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Stylized car element (below checkmark) -->
  <g transform="translate(90, 125)">
    <!-- Car body (simplified, blue) -->
    <ellipse cx="0" cy="2" rx="16" ry="6" fill="#1e40af" opacity="0.8"/>
    <!-- Car top -->
    <rect x="-8" y="-3" width="16" height="5" rx="2" fill="#2563eb" opacity="0.9"/>
    <!-- Windows hint -->
    <rect x="-6" y="-2" width="5" height="3" rx="1" fill="#3b82f6" opacity="0.5"/>
    <rect x="1" y="-2" width="5" height="3" rx="1" fill="#3b82f6" opacity="0.5"/>
  </g>
  
  <!-- Subtle glossy overlay effect on shield -->
  <ellipse cx="75" cy="50" rx="20" ry="25" fill="white" opacity="0.15"/>
</svg>
